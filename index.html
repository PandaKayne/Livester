<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIVESTER</title>
<style>
  :root{
    --zoro:#2f9e4f;
    --zoro-deep:#0c3b24;
    --sea:#06201a;
    --gear5:#f7f9ff;
    --sun:#ffd34d;
    --yt:#ff0000;
    --ink:#000;
  }
  *{box-sizing:border-box;margin:0}
  html,body{min-height:100%}
  body{
    font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
    color:var(--gear5);
    background:
      radial-gradient(60% 40% at 50% 0%, rgba(255,255,255,.35), transparent 70%),
      radial-gradient(50% 35% at 85% 20%, rgba(255,211,77,.22), transparent 70%),
      radial-gradient(70% 50% at 10% 90%, rgba(47,158,79,.55), transparent 70%),
      linear-gradient(160deg, var(--zoro-deep), var(--sea) 70%);
    background-attachment:fixed;
    display:flex;justify-content:center;
    padding:48px 20px 64px;
  }
  main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:28px}

  .logo{
    width:150px;height:150px;border-radius:50%;
    display:grid;place-items:center;
    background:linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,.08));
    border:1.5px solid rgba(255,255,255,.7);
    box-shadow:0 10px 40px rgba(47,158,79,.45), inset 0 2px 8px rgba(255,255,255,.8), inset 0 -10px 20px rgba(0,0,0,.2);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    position:relative;overflow:hidden;
  }
  .logo::after{
    content:"";position:absolute;top:-30%;left:-20%;width:140%;height:55%;
    background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0));
    border-radius:50%;transform:rotate(-8deg);pointer-events:none;
  }
  .logo svg{width:104px;height:104px;position:relative;z-index:1}

  h1{
    font-size:clamp(44px,15vw,64px);
    font-weight:900;letter-spacing:1px;line-height:1;
    color:var(--yt);
    -webkit-text-stroke:7px var(--ink);
    paint-order:stroke fill;
    text-shadow:0 6px 0 rgba(0,0,0,.35);
  }

  .links{width:100%;display:flex;flex-direction:column;gap:16px}
  .link{
    position:relative;overflow:hidden;
    display:flex;align-items:center;gap:16px;
    padding:18px 22px;border-radius:22px;
    text-decoration:none;color:var(--gear5);
    font-size:20px;
    background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.07));
    border:1.5px solid rgba(255,255,255,.55);
    box-shadow:0 8px 28px rgba(0,0,0,.35), inset 0 1.5px 4px rgba(255,255,255,.7), inset 0 -8px 16px rgba(0,0,0,.18);
    backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .link::before{
    content:"";position:absolute;inset:0 0 50% 0;
    background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));
    border-radius:22px 22px 60% 60%/22px 22px 24px 24px;pointer-events:none;
  }
  .link:hover{transform:translateY(-3px)}
  .link:active{transform:scale(.98)}
  .link:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
  .link .ico{
    flex:none;width:48px;height:48px;border-radius:14px;
    display:grid;place-items:center;position:relative;z-index:1;
    border:2px solid var(--ink);
    box-shadow:inset 0 2px 4px rgba(255,255,255,.6);
  }
  .link .ico svg{width:26px;height:26px}
  .link span{position:relative;z-index:1;text-shadow:0 2px 6px rgba(0,0,0,.5)}
  .yt .ico{background:var(--yt)}
  .ig .ico{background:linear-gradient(45deg,#f9a03f,#e1306c 55%,#833ab4)}
  .fb .ico{background:#1877f2}

  @media (prefers-reduced-motion:no-preference){
    .logo{animation:float 5s ease-in-out infinite}
    @keyframes float{50%{transform:translateY(-8px)}}
  }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 120 120">
      <!-- huesos cruzados -->
      <g stroke="#fff" stroke-width="7" stroke-linecap="round">
        <line x1="26" y1="98" x2="94" y2="62"/>
        <line x1="94" y1="98" x2="26" y2="62"/>
      </g>
      <g fill="#fff"><circle cx="24" cy="100" r="6"/><circle cx="96" cy="100" r="6"/><circle cx="24" cy="60" r="6"/><circle cx="96" cy="60" r="6"/></g>
      <!-- calavera -->
      <path d="M60 40c-17 0-28 11-28 25 0 9 4 15 10 19v8h36v-8c6-4 10-10 10-19 0-14-11-25-28-25z" fill="#fff" stroke="#000" stroke-width="3"/>
      <ellipse cx="49" cy="66" rx="7" ry="8" fill="#000"/>
      <ellipse cx="71" cy="66" rx="7" ry="8" fill="#000"/>
      <path d="M60 74l-4 8h8z" fill="#000"/>
      <!-- sombrero -->
      <ellipse cx="60" cy="40" rx="42" ry="10" fill="#ffd34d" stroke="#000" stroke-width="3"/>
      <path d="M36 38c0-18 10-28 24-28s24 10 24 28c-14 5-34 5-48 0z" fill="#ffd34d" stroke="#000" stroke-width="3"/>
      <path d="M37 33c14 5 32 5 46 0l1 6c-14 5-34 5-48 0z" fill="#e5252a" stroke="#000" stroke-width="2"/>
    </svg>
  </div>

  <h1>LIVESTER</h1>

  <nav class="links" aria-label="Mis redes">
    <a class="link yt" href="https://youtube.com/@livester__?si=p4PNh3HqhamAZRny" target="_blank" rel="noopener">
      <div class="ico"><svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></div>
      <span>YouTube</span>
    </a>
    <a class="link ig" href="https://www.instagram.com/livester___?cplk=OHozbGR4enkyN3A5" target="_blank" rel="noopener">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="#fff" stroke="none"/></svg></div>
      <span>Instagram</span>
    </a>
    <a class="link fb" href="https://www.facebook.com/share/1DibZYNFts/" target="_blank" rel="noopener">
      <div class="ico"><svg viewBox="0 0 24 24" fill="#fff"><path d="M14 8h3V4h-3c-2.8 0-5 2.2-5 5v2H6v4h3v7h4v-7h3l1-4h-4V9c0-.6.4-1 1-1z"/></svg></div>
      <span>Facebook</span>
    </a>
  </nav>
</main>
</body>
  </html>
